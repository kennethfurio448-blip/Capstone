<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MedTrack</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <h1>MedTrack</h1>
                <p>PDRRMO Inventory Management System</p>
            </div>

            <div class="form-heading">
                <h2>Welcome Back</h2>
                <p>Sign in using your MedTrack account.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show or hide password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" class="forgot-password">
                        Forgot password?
                    </a>
                </div>

                <p class="form-message" id="formMessage"></p>

                <button type="submit" class="login-button">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>

            </form>

            <p class="create-account-link">
                Accounts are created by an administrator.
            </p>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../auth/supabase-client.js"></script>
    <script src="../auth/supabase-auth.js"></script>
    <script src="login.js"></script>

</body>
</html>
