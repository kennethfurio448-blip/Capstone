<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=login/login.html">

    <title>Create Account | MedTrack</title>

    <link rel="stylesheet" href="create-account.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="create-account-container">

        <section class="create-account-card">

            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <h1>MedTrack</h1>
                <p>PDRRMO Inventory Management System</p>
            </div>

            <div class="form-heading">
                <h2>Create Account</h2>
                <p>Enter your information to create an account.</p>
            </div>

            <form id="createAccountForm">

                <div class="input-group">
                    <label for="fullname">Full Name</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="fullname"
                            placeholder="Enter your full name"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="username">Username</label>

                    <div class="input-box">
                        <i class="fa-solid fa-user-tag"></i>

                        <input
                            type="text"
                            id="username"
                            placeholder="Create a username"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>

                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email address"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="role">Account Role</label>

                    <div class="input-box">
                        <i class="fa-solid fa-users-gear"></i>

                        <select id="role" required>
                            <option value="" disabled selected>
                                Select account role
                            </option>

                            <option value="admin">Admin</option>
                            <option value="staff">Staff</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="togglePassword"
                            aria-label="Show or hide password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="toggleConfirmPassword"
                            aria-label="Show or hide confirmed password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <p class="form-message" id="formMessage"></p>

                <button type="submit" class="create-button">
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>

            </form>

            <p class="login-link">
                Already have an account?
                <a href="login/login.html">Sign in</a>
            </p>

        </section>

    </main>

    <script src="create-account.js"></script>

</body>
</html>
