<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="MedTrack is a medical inventory and emergency response management system."
    >

    <title>MedTrack Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #202124;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .landing-card {
            width: 100%;
            max-width: 600px;
            padding: 48px 32px;

            background: #ffffff;
            border: 1px solid #e4e7eb;
            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 12px 35px
                rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            color: #ffffff;
            background: #b71c1c;
            border-radius: 18px;

            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            margin-bottom: 12px;
            color: #b71c1c;
            font-size: 38px;
        }

        p {
            margin-bottom: 28px;
            color: #70757a;
            line-height: 1.7;
        }

        .login-button {
            padding: 14px 26px;

            display: inline-block;

            color: #ffffff;
            background: #b71c1c;
            border-radius: 10px;

            font-weight: bold;
            text-decoration: none;
        }

        .login-button:hover {
            background: #8e1111;
        }
    </style>
</head>

<body>
    <main class="landing-card">
        <div class="logo">
            +
        </div>

        <h1>MedTrack</h1>

        <p>
            Medical inventory, equipment,
            mobility, borrowing, and emergency
            response management system.
        </p>

        <a
            href="login/login.html"
            class="login-button"
        >
            Open MedTrack
        </a>
    </main>
</body>
</html>
