name: MedTrack quality checks

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test

  authenticated-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MEDTRACK_E2E_URL: https://www.medtrackmanagement.com
      MEDTRACK_E2E_STAFF_IDENTIFIER: ${{ secrets.MEDTRACK_E2E_STAFF_IDENTIFIER }}
      MEDTRACK_E2E_STAFF_PASSWORD: ${{ secrets.MEDTRACK_E2E_STAFF_PASSWORD }}
      MEDTRACK_E2E_ADMIN_IDENTIFIER: ${{ secrets.MEDTRACK_E2E_ADMIN_IDENTIFIER }}
      MEDTRACK_E2E_ADMIN_PASSWORD: ${{ secrets.MEDTRACK_E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/authenticated-access.spec.js

  verify-production:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:deployment
